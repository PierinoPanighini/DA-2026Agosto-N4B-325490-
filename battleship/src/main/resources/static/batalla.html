<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Librar batalla</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="/estilos.css">
</head>
<body class="fondo-combate">
  <main class="contenedor">
    <a class="volver" href="/"><span aria-hidden="true">&#8249;</span> Volver a la sala de operaciones</a>

    <header class="tarjeta encabezado-batalla">
      <h1 id="lugarCombate"></h1>
      <div class="datos-batalla">
        <p>Ronda <strong>#<span id="numeroRonda"></span></strong></p>
        <p class="dato-estado">Estado <span id="estadoBatalla" class="chip"></span></p>
      </div>
    </header>

    <div id="mensaje" class="mensaje" role="status"></div>

    <section class="tarjeta panel-tablero panel-batalla" aria-label="Tablero">
      <div id="tablero"></div>
      <ul class="referencias" aria-label="Referencias del tablero">
        <li><span class="muestra muestra-barco"></span> Barco</li>
        <li><span class="muestra muestra-agua"></span> Agua</li>
        <li><span class="muestra muestra-impacto"></span> Impacto</li>
      </ul>
    </section>
  </main>

  <script type="module">
    import CommandDispatcher from '/CommandDispatcher.js';
    import SSECommandDispatcher from '/SSECommandDispatcher.js';

    import BattleShipBoard from '/BattleShipBoard.js';

    const zonaMensaje = document.getElementById('mensaje');
    const estadoBatalla = document.getElementById('estadoBatalla');

    const clasePorEstado = {
      'En preparación': 'chip-preparacion',
      'En combate': 'chip-combate',
      'Ganada': 'chip-ganada',
      'Perdida': 'chip-perdida'
    };

    const idBatalla = new URLSearchParams(window.location.search).get('batalla');

    function mostrarMensaje(texto) {
      zonaMensaje.textContent = texto;
    }

    // Agrega el identificador de la batalla a las coordenadas del tablero.
    const dispatcherTablero = {
      mapFunctions: (funciones, opciones) => CommandDispatcher.mapFunctions(funciones, opciones),
      submit: (url, coordenadas) => {
        mostrarMensaje('');
        return CommandDispatcher.submit(url, { ...coordenadas, idBatalla });
      }
    };

    new BattleShipBoard(document.getElementById('tablero'), dispatcherTablero);

    const vista = CommandDispatcher.registerView('Batalla', {
      urlCierre: '/cu03/finCasoUso?idBatalla=' + encodeURIComponent(idBatalla),
      onException: mostrarMensaje,
      onError: () => mostrarMensaje('No se pudo completar la acción.')
    });

    vista.handler('lugarCombate', (lugar) => {
      document.getElementById('lugarCombate').textContent = lugar;
    });

    vista.handler('cargarNumeroRonda', (numero) => {
      document.getElementById('numeroRonda').textContent = numero;
    });

    vista.handler('cargarEstado', (estado) => {
      estadoBatalla.textContent = estado;
      estadoBatalla.className = 'chip ' + clasePorEstado[estado];
    });

    vista.handler('mensaje', mostrarMensaje);

    // Registra los handlers antes de abrir el canal que trae el tablero inicial.
    CommandDispatcher.startView(vista);

    const conexionSSE = new SSECommandDispatcher(
      '/cu03/registrarSSE?idBatalla=' + encodeURIComponent(idBatalla),
      CommandDispatcher,
      () => mostrarMensaje('Se perdió la conexión con la batalla. Recargá la página para reconectar.')
    );

    window.addEventListener('pagehide', () => conexionSSE.disconnect());
  </script>
  <script type="module">
    //-------------------------------EXTRAS SONIDOS----------------------------------//
    import Sonidos from '/Sonidos.js';
    Sonidos.instalarEnVista();
  </script>
</body>
</html>
